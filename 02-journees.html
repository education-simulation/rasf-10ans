<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RASF 10 ans · Les Journées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#0B1F4D; --nuit2:#13295f; --or:#F2B41F; --or-clair:#f7d27a;
  --papier:#FBF8F1; --encre:#1b2440; --gris:#6b7187; --trait:#e4dccb;
  --conf:#0B1F4D; --atelier:#2e7d6b; --visite:#8a5a9e; --fourn:#c9861a; --asso:#b23b3b; --convi:#8b8f9c;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050d24;font-family:"Source Sans 3",system-ui,sans-serif;color:var(--encre)}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center center;background:var(--papier);display:grid;grid-template-rows:84px 1fr 44px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
/* frise */
.frise{background:var(--nuit);display:flex;align-items:center;padding:0 40px;gap:6px;position:relative}
.frise .logo{font-family:"Playfair Display",serif;color:var(--or);font-size:30px;font-weight:700;letter-spacing:2px;margin-right:28px;white-space:nowrap}
.frise .logo small{display:block;font-family:"Source Sans 3";font-size:12px;letter-spacing:3px;color:#c9d2ea;font-weight:600}
#stage{grid-template-columns:minmax(0,1fr)}
.frise{min-width:0;overflow:hidden}
/* Sélecteur d'années : en haut du panneau bleu de gauche */
.selecteur{position:absolute;top:100px;left:28px;width:344px;height:84px;display:flex;align-items:center;gap:6px;z-index:6}
.selecteur .an{background:var(--nuit2);font-size:16px;padding:5px 11px}
.cartouche{padding-top:132px!important}
.selecteur .fenetre{align-items:flex-start;padding-top:10px}
.fenetre{flex:1;min-width:0;overflow:hidden;align-self:stretch;display:flex;align-items:center;position:relative}
.annees{display:flex;position:relative;transition:transform .6s cubic-bezier(.4,0,.2,1)}
.annees::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(242,180,31,.35)}
.annees .case{flex:none;display:flex;justify-content:center;position:relative}
.chev{all:unset;flex:none;cursor:pointer;width:32px;height:32px;margin-top:-30px;border-radius:50%;display:grid;place-items:center;font:700 22px/1 "Source Sans 3";color:var(--or);border:2px solid rgba(242,180,31,.5);transition:.15s}
.chev:hover{background:var(--or);color:var(--nuit)}
.chev:disabled{opacity:.25;cursor:default;background:none;color:var(--or)}
.frise .logo{margin-right:18px!important}
.an{position:relative;z-index:1;background:var(--nuit);border:2px solid rgba(242,180,31,.5);color:#dfe5f5;font:600 17px "Source Sans 3";padding:6px 12px;border-radius:20px;cursor:pointer;transition:.15s}
.an:hover{border-color:var(--or);color:#fff}
.an.on{background:var(--or);color:var(--nuit);border-color:var(--or)}
.an small{position:absolute;left:50%;top:calc(100% + 3px);transform:translateX(-50%);font:600 12px "Source Sans 3";color:#9fb0d8;white-space:nowrap;letter-spacing:.3px;pointer-events:none}
.an.on small{color:var(--or)}
.an.annule{text-decoration:line-through;opacity:.7}
/* fiche */
.fiche{display:grid;grid-template-columns:400px 1fr;min-height:0}
.cartouche{background:var(--nuit2);color:#fff;padding:44px 40px;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cartouche::after{content:"";position:absolute;right:-70px;bottom:-70px;width:260px;height:260px;border:3px solid rgba(242,180,31,.25);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.edition{color:var(--or);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:15px}
.annee{font-family:"Playfair Display",serif;font-size:132px;line-height:1;color:var(--or);margin:8px 0 6px}
.ville{font-family:"Playfair Display",serif;font-size:44px;line-height:1.05}
.lieu{font-size:20px;color:#c9d2ea;margin-top:10px;line-height:1.3}
.dates{margin-top:22px;display:inline-block;align-self:flex-start;border:2px solid var(--or);color:var(--or);padding:6px 14px;border-radius:4px;font-weight:700;font-size:18px}
.statut{margin-top:16px;font-size:15px;color:var(--or-clair);font-style:italic;line-height:1.35}
.drole{margin-top:34px;position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
/* Signature : « Anonyme » laisse place au vrai nom, en fondu, à l'entrée comme à la sortie du survol */
.drole .sig{display:grid;justify-items:end;align-items:end;margin-top:8px;cursor:help;min-height:30px}
.drole .sig>span{grid-area:1/1;transition:opacity .45s ease,transform .45s cubic-bezier(.2,.7,.2,1)}
.drole .sig .anon{font-style:italic;font-weight:600;color:var(--gris)}
.drole .sig .vrai{display:block;font:700 36px "Playfair Display",serif;color:var(--asso);line-height:1.1;opacity:0;transform:translateY(8px) scale(.92);transform-origin:right bottom;pointer-events:none}
.drole .sig:hover .anon{opacity:0;transform:translateY(-6px)}
.drole .sig:hover .vrai{opacity:1;transform:none}
@keyframes demasque{from{opacity:0;transform:scale(.4) rotate(-6deg)}to{opacity:1;transform:none}}
.drole p.confetti{cursor:pointer}
.drole .lab{color:var(--fourn);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px;animation:entre .6s ease both 2.1s}
.drole p{background:rgba(242,180,31,.16);border-left:5px solid var(--or);padding:14px 18px;font-size:21px;line-height:1.35;color:var(--nuit);font-weight:600;border-radius:0 6px 6px 0;animation:entre .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(2.4s + var(--i)*400ms)}
/* Ligne qui s'étire jusqu'en bas de la colonne (Restaurant 2021 : nuit blanche + médias) */
.item.etire{flex:1;align-items:stretch;margin-bottom:0}
.item.etire .corps{display:flex;flex-direction:column}
.item.etire .h.plage i{flex:1;height:auto!important;transform-origin:top;animation:descend 2.8s cubic-bezier(.45,0,.2,1) 1s both}
.item.etire .h.plage span:last-child{animation:entre .5s both 3.7s}
.item.etire.media .h.plage i{flex:none;height:34px!important;animation:none}
.item.etire.media .h.plage span:last-child{animation:none}
@keyframes descend{from{transform:scaleY(0)}to{transform:scaleY(1)}}
/* La zone jaune descend en même temps que le trait (fond porté par un pseudo-élément, pour ne pas rogner le zoom des photos) */
.item.fete.etire{position:relative;background:none;box-shadow:none}
.item.fete.etire::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:8px;background:rgba(242,180,31,var(--a,.15));animation:zone 2.8s cubic-bezier(.45,0,.2,1) 1s both}
@keyframes zone{from{clip-path:inset(0 0 calc(100% - 92px) 0 round 8px)}to{clip-path:inset(0 0 0 0 round 8px)}}
.item.etire .pola{animation-delay:calc(2s + var(--i)*300ms)}
/* Photos de soirée façon polaroïd, dans la zone jaune */
.polas{position:relative;flex:1;min-height:200px;margin-top:10px}
.pola{position:absolute;width:120px;background:#fff;padding:6px 6px 20px;box-shadow:0 8px 18px rgba(11,31,77,.35);border-radius:2px;transform:rotate(var(--r));animation:tombe .7s cubic-bezier(.2,.9,.3,1.2) backwards;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;transform-origin:center bottom;cursor:zoom-in;animation-delay:calc(1.2s + var(--i)*350ms)}
.pola img{display:block;width:100%;height:120px;object-fit:cover;background:#222}
.pola span{position:absolute;left:0;right:0;bottom:2px;text-align:center;font:600 11px "Source Sans 3";color:#555;letter-spacing:.5px}
.pola.son button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;height:120px;border:0;background:var(--nuit);color:var(--or);font:700 15px "Source Sans 3";cursor:pointer}
.pola.son button b{font-size:38px;line-height:1}
.pola.son.joue button b{animation:zoomfete .8s ease-in-out infinite}
/* Survol : la photo se redresse et s'agrandit */
.pola:hover{transform:rotate(0) scale(2.3);z-index:20;box-shadow:0 24px 60px rgba(11,31,77,.55)}
.pola.son:hover{cursor:pointer}
.pola span.fort{font:700 15px "Playfair Display",serif;color:var(--nuit);letter-spacing:3px;bottom:1px}
@keyframes tombe{from{opacity:0;transform:translateY(-60px) rotate(calc(var(--r) - 25deg)) scale(1.3)}to{opacity:1;transform:rotate(var(--r))}}
.cartouche .source{margin-top:auto;font-size:12.5px;color:#8f9ac0;line-height:1.35;position:relative;z-index:1}
.jours{display:grid;grid-template-columns:1fr 1fr;gap:0;padding:30px 36px 20px;min-height:0}
.jours.large{grid-template-columns:1.5fr 1fr}
.jour{padding:0 22px;min-height:0;min-width:0;display:flex;flex-direction:column}
.jour+.jour{border-left:1px solid var(--trait)}
.jour h3{font-family:"Playfair Display",serif;font-size:28px;color:var(--nuit);display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.jour h3 span{font:600 15px "Source Sans 3";color:var(--gris);letter-spacing:1px;text-transform:uppercase}
.item{display:grid;grid-template-columns:74px 12px 1fr;gap:10px;padding:7px 0;border-bottom:1px dashed var(--trait);align-items:start}
.item:last-child{border-bottom:0}
.item.fete{background:rgba(242,180,31,var(--a,.15));border-bottom:0;margin:3px -10px;padding:8px 10px;border-radius:8px;box-shadow:0 2px 0 rgba(201,134,26,calc(var(--a,.15)*.6))}
.item.fete .h{color:var(--nuit)}
/* Plage horaire « début | trait vertical | fin » (restaurant qui s'éternise) */
.h.plage{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.h.plage i{display:block;width:2px;background:currentColor;margin:4px 0 4px 10px;border-radius:2px}
.h.plage span:last-child{white-space:normal}
.h.plage span.flou{filter:blur(2.6px)}
.item.fete .pt{background:var(--nuit)!important;margin-top:calc(var(--fs,16.5px)*.525 - 5px)}
.item.fete .q{color:#5a4a1e;margin-top:5px}
.item.fete .t{font-family:"Playfair Display",serif;line-height:1.05;color:var(--nuit)}
/* Lyon 2019 : Apéro et Restaurant zooment en boucle */
@keyframes zoomfete{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
.item.fete.zoom .t{display:inline-block;transform-origin:left center;animation:zoomfete 1.6s ease-in-out infinite}
.item.fete.zoom+.item.fete.zoom .t{animation-delay:.8s}
.h{font-weight:700;color:var(--fourn);font-size:15px;padding-top:2px;font-variant-numeric:tabular-nums}
.pt{width:10px;height:10px;border-radius:50%;margin-top:7px}
.t{font-size:16.5px;line-height:1.25;font-weight:600}
.q{font-size:14px;color:var(--gris);line-height:1.25;margin-top:2px}
.vide{margin:auto;text-align:center;max-width:820px;padding:40px}
.vide blockquote{font-family:"Playfair Display",serif;font-size:30px;line-height:1.35;color:var(--nuit)}
.vide .chiffres{display:flex;justify-content:center;gap:56px;margin:36px 0 26px}
.vide .chiffres b{display:block;font-family:"Playfair Display",serif;font-size:72px;color:var(--or);line-height:1.1;margin-bottom:14px;font-variant-numeric:lining-nums}
.vide .chiffres span{font-size:16px;color:var(--gris);text-transform:uppercase;letter-spacing:1px}
.vide p{font-size:17px;color:var(--gris);line-height:1.45}
/* 2020 : la visio de l'époque (« tu me vois ? tu m'entends ? ») */
.visio{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 20px 0}
.visio .titre{font:700 34px "Playfair Display",serif;color:var(--nuit);text-decoration:line-through;text-decoration-color:var(--asso);text-decoration-thickness:3px}
.visio .sous{font-size:18px;color:var(--gris);margin:4px 0 18px}
.ecranv{background:#1f2430;border-radius:14px;padding:14px;box-shadow:0 16px 40px rgba(11,31,77,.35);width:1060px}
.mos{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tuile{position:relative;height:200px;border-radius:10px;overflow:hidden;background:linear-gradient(160deg,var(--c1),var(--c2));display:flex;align-items:flex-end;justify-content:center;outline:3px solid transparent;transition:outline-color .2s}
.tuile .perso{position:relative;width:120px;height:150px}
.tuile .perso::before{content:"";position:absolute;left:34px;top:18px;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.85)}
.tuile .perso::after{content:"";position:absolute;left:10px;top:78px;width:100px;height:90px;border-radius:50px 50px 0 0;background:rgba(255,255,255,.85)}
.tuile .nom{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 8px;border-radius:5px;display:flex;gap:6px;align-items:center}
.tuile .mute{color:#ff5b5b;font-weight:700}
.tuile.parle{outline-color:#3ddc84}
.tuile.noire{background:#2a2f3c;align-items:center}
.tuile.noire .ini{width:84px;height:84px;border-radius:50%;background:var(--c1);color:#fff;font:700 34px "Source Sans 3";display:flex;align-items:center;justify-content:center}
.tuile.fige .perso{filter:blur(5px) saturate(.4);transform:translateX(18px) skewX(-8deg)}
.tuile .bandeau{position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,.6);color:#ffd166;font-size:13px;padding:5px 10px;text-align:center}
.tuile.recon{background:#2a2f3c;align-items:center;flex-direction:column;justify-content:center;color:#c9d2ea;font-size:15px;gap:10px}
.tuile.recon i{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;animation:tourne 1s linear infinite}
.tuile.couche{align-items:center}.tuile.couche .perso{transform:rotate(-90deg)}
@keyframes tourne{to{transform:rotate(360deg)}}
.bulle{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:#fff;color:var(--nuit);font:700 19px "Source Sans 3";padding:8px 14px;border-radius:14px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);animation:bulle 2.4s ease both;z-index:2}
.bulle::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
@keyframes bulle{0%{opacity:0;transform:translateX(-50%) scale(.5)}10%{opacity:1;transform:translateX(-50%) scale(1.08)}16%{transform:translateX(-50%) scale(1)}85%{opacity:1}100%{opacity:0}}
.barrev{display:flex;justify-content:center;gap:14px;margin-top:14px}
.barrev span{width:46px;height:46px;border-radius:50%;background:#3a4050;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative}
.barrev span.off{background:#e5484d}
.barrev span.quit{width:auto;padding:0 20px;border-radius:23px;background:#e5484d;font:700 15px "Source Sans 3"}
.visio .note{margin-top:16px;font-size:17px;color:var(--gris)}
/* 2017 : cercle dessiné à la main autour de la soirée = thématique récurrente */
.jour{position:relative}
.cercle{position:absolute;pointer-events:none;overflow:visible;z-index:3}
.cercle rect{fill:none;stroke:#e0703f;stroke-width:5;stroke-linecap:round;stroke-dasharray:1.15 1.15;stroke-dashoffset:1.15;animation:trace 1.3s cubic-bezier(.5,0,.3,1) 1.6s forwards}
@keyframes trace{to{stroke-dashoffset:0}}
.recurrent{position:absolute;font:700 34px "Caveat",cursive;color:#e0703f;transform:rotate(-4deg);white-space:nowrap;z-index:3;pointer-events:none;animation:entre .6s both 2.9s}
.recurrent .rec-liste{display:block;margin:4px 0 0 18px;font-size:27px;line-height:1.15}
.recurrent .rec-liste span{display:block}
.recurrent .rec-liste span::before{content:"– "}
html.apercu .cercle rect{stroke-dashoffset:0}
/* 2018 : pastis (effet ouzo), animation discrète */
.scene{flex:1;display:flex;align-items:center;justify-content:center;gap:20px;padding-top:6px;min-height:0}
.pastis{margin:0;text-align:center}
.pastis figcaption{font:700 22px "Caveat",cursive;color:#7a4f0c;line-height:1.05;margin-top:2px}
.pastis .liquide{fill:#d9a21c;animation:remplir-pastis 2.8s cubic-bezier(.45,0,.2,1) 1s both,louche 7s ease-in-out 4.2s infinite}
@keyframes remplir-pastis{from{transform:translateY(84px)}to{transform:translateY(0)}}
.pastis .eau{fill:#cfe8f3;opacity:0;animation:verse 7s ease-in-out 4.2s infinite}
.pastis .goutte{fill:#8fc3dc;opacity:0;animation:goutte 7s ease-in 4.2s infinite}
.pastis .g2{animation-delay:4.45s}.pastis .g3{animation-delay:4.7s}
@keyframes goutte{0%{opacity:0;transform:translateY(0)}4%{opacity:1}22%{opacity:1;transform:translateY(80px)}26%,100%{opacity:0;transform:translateY(80px)}}
@keyframes verse{0%,15%{opacity:0}25%,55%{opacity:.9}70%,100%{opacity:0}}
@keyframes louche{0%,20%{fill:#d9a21c}45%,85%{fill:#f2e3a6}100%{fill:#d9a21c}}
/* 2021 : la nuit blanche n'en finit pas — le trait s'allonge et la page défile vers le bas */
.jours.defile{overflow:hidden}
.h.plage{position:relative}
.h.plage em.marque{position:absolute;left:18px;font:700 15px "Source Sans 3";font-style:normal;color:var(--nuit);white-space:nowrap}
/* Carte de France dans le cartouche : point de la ville de l'édition */
.carte-fr{margin-top:22px;position:relative;z-index:1}
.carte-fr .pays{fill:rgba(255,255,255,.07);stroke:rgba(242,180,31,.55);stroke-width:1.5;stroke-linejoin:round}
.carte-fr .seg{fill:none;stroke:rgba(242,180,31,.45);stroke-width:1.6;stroke-dasharray:1 1;stroke-dashoffset:1;animation:trace .45s linear forwards;animation-delay:calc(.5s + var(--k)*.4s)}
.carte-fr .seg.dernier{stroke:var(--or);stroke-width:2.6;filter:drop-shadow(0 0 3px rgba(242,180,31,.8))}
html.apercu .carte-fr .seg{stroke-dashoffset:0}
.carte-fr .autre{fill:rgba(242,180,31,.35)}
.carte-fr .ici{fill:var(--or)}
.carte-fr .onde{fill:none;stroke:var(--or);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:onde 1.8s ease-out .8s infinite}
@keyframes onde{from{transform:scale(1);opacity:.9}to{transform:scale(4);opacity:0}}
.carte-fr{overflow:visible}
.carte-fr .ancienne{fill:#c9d2ea;opacity:.75;font:600 12px "Source Sans 3";animation:entre .6s both .6s}
.carte-fr .nom{fill:#fff;font:700 17px "Source Sans 3"}
.carte-fr .lyc{fill:#c9d2ea;font:600 13px "Source Sans 3"}
/* Book des Journées : pages en vignettes, agrandies au survol */
.book{margin-top:30px}
.book .lab{color:var(--fourn);font-weight:700;letter-spacing:3px;text-transform:uppercase;font-size:13px;margin-bottom:12px}
.book .pages{display:flex;gap:14px}
.book img{width:92px;height:122px;object-fit:cover;border-radius:4px;box-shadow:0 8px 18px rgba(11,31,77,.3);transform-origin:center bottom;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;cursor:zoom-in;position:relative;animation:entre .6s backwards;animation-delay:calc(1s + var(--i)*200ms)}
.book img:last-child{transform-origin:right bottom}
.book img:first-child{transform-origin:left bottom}
.book img:hover{transform:scale(3.4);z-index:20;box-shadow:0 30px 70px rgba(11,31,77,.6)}
/* 2025 : les jeunes arrivent à 11h après leur nuit à La Chapelle — carte néon */
.item.jeunes{grid-template-columns:74px 12px 1fr 100px;background:#120a2e;border-radius:10px;margin:4px -10px;padding:10px;border-bottom:0;border:3px solid #ff6fcf;box-shadow:0 0 6px #ff3fb4,0 0 16px #ff3fb4,0 0 36px rgba(255,63,180,.75),0 0 70px rgba(255,63,180,.35),inset 0 0 12px rgba(255,63,180,.55);animation:entre .5s cubic-bezier(.2,.7,.2,1) both,neonbord 4s infinite 1.2s;animation-delay:calc(.35s + var(--i)*70ms),1.2s}
@keyframes neonbord{0%,100%{border-color:#ff6fcf;box-shadow:0 0 6px #ff3fb4,0 0 16px #ff3fb4,0 0 36px rgba(255,63,180,.75),0 0 70px rgba(255,63,180,.35),inset 0 0 12px rgba(255,63,180,.55)}
 50%{border-color:#ff9be0;box-shadow:0 0 8px #ff3fb4,0 0 24px #ff3fb4,0 0 52px rgba(255,63,180,.9),0 0 96px rgba(255,63,180,.5),inset 0 0 18px rgba(255,63,180,.7)}
 70%,74%{border-color:#7a2a5c;box-shadow:0 0 2px rgba(255,63,180,.3),inset 0 0 4px rgba(255,63,180,.2)}72%,76%{border-color:#ff6fcf}}
.item.jeunes .h{color:#ff7fd0}
.item.jeunes .t{color:#fff;font:700 24px "Playfair Display",serif;text-shadow:0 0 8px #ff3fb4,0 0 18px #ff3fb4;animation:neon 3.2s infinite 1.5s}
.item.jeunes .q{color:#d9c8ff;font-size:14.5px;margin-top:4px}
@keyframes neon{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.35}}
.vitrail{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#ff7fd0;font:700 11px "Source Sans 3"}

.scene.lyon{gap:26px;justify-content:center}
.mets{margin:0;text-align:center;animation:mets-arrive .7s cubic-bezier(.2,.9,.3,1.3) both,mets-balance 3s ease-in-out infinite;animation-delay:calc(1.4s + var(--k)*.9s),calc(4.2s + var(--k)*.5s)}
.mets svg{width:100%;max-width:150px;height:auto}
.scene.lyon{min-width:0;max-width:100%}
.scene.lyon .mets{flex:1 1 0;min-width:0}
.mets figcaption{white-space:nowrap}
.mets figcaption{font:700 22px "Caveat",cursive;color:#7a1530;margin-top:4px}
@keyframes mets-arrive{from{opacity:0;transform:translateY(-50px) rotate(-12deg) scale(.6)}to{opacity:1;transform:none}}
@keyframes mets-balance{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg) translateY(-3px)}}
/* 2016 : grille de rotation animée */
.rotation{position:relative;margin-top:14px}
.rotation .sms{position:absolute;right:0;top:-6px;display:flex;align-items:center;gap:6px;background:var(--nuit);color:#fff;font:700 13px "Source Sans 3";padding:5px 10px;border-radius:14px;opacity:0}
.rotation .sms.ping{animation:ping 1.5s ease both}
@keyframes ping{0%{opacity:0;transform:translateY(6px) scale(.8)}12%,70%{opacity:1;transform:none}100%{opacity:0}}
.grille{display:grid;grid-template-columns:34px repeat(var(--n),1fr);gap:2px;margin-top:26px;font-size:10.5px}

.grille i{font:700 10.5px "Source Sans 3";font-style:normal;color:var(--gris);align-self:center}
.grille span{height:19px;line-height:19px;text-align:center;white-space:nowrap;overflow:hidden;border-radius:3px;background:hsl(var(--h,0),45%,88%);color:hsl(var(--h,0),45%,25%);font-weight:600;transition:transform .3s,box-shadow .3s,opacity .3s;opacity:.55}

.batiment{margin-top:14px}
.batiment .lab,.bandeau .lab{color:var(--fourn);font-weight:700;letter-spacing:2px;text-transform:uppercase;font-size:12px;margin-bottom:6px}
.coupe{position:relative;border:2px solid var(--nuit);border-radius:6px 6px 0 0;padding:6px 6px 0;background:#fff;display:flex;flex-direction:column;gap:4px}
.coupe .niv{display:flex;gap:5px;align-items:stretch;height:84px;border-bottom:1px dashed var(--trait)}

.coupe .salle.hall{flex:1;background:rgba(242,180,31,.25);color:#7a4f0c;font-size:13px}
.batiment{position:relative}
.batiment .heure{float:right;font:700 14px "Source Sans 3";color:var(--nuit);background:var(--or);border-radius:10px;padding:1px 10px;letter-spacing:0}
.batiment .sms{position:absolute;right:0;top:-30px;display:flex;align-items:center;gap:6px;background:var(--nuit);color:#fff;font:700 13px "Source Sans 3";padding:5px 10px;border-radius:14px;opacity:0;z-index:3}
.batiment .sms.ping{animation:ping 2.6s ease both}
.coupe .eq{position:absolute;left:0;top:0;width:44px;height:22px;border-radius:11px;background:#2e8b8b;color:#fff;font:700 11px/22px "Source Sans 3";font-style:normal;text-align:center;transition:left 1.6s cubic-bezier(.4,0,.2,1),top 1.6s cubic-bezier(.4,0,.2,1),opacity .4s;box-shadow:0 1px 3px rgba(0,0,0,.3)}

.frise{grid-row:1;grid-column:1}.fiche{grid-row:2/4;grid-column:1}
